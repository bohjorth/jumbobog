<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Jumbobog</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: #fff;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 120px);
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        img {
            width: 120px;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<h1>Jumbobøger</h1>

<div class="grid" id="grid"></div>

<script>
    const grid = document.getElementById('grid');

    for (let i = 1; i <= 100; i++) {
        const img = document.createElement('img');
        img.src = '/api/cover/' + i;
        grid.appendChild(img);
    }
</script>

</body>
</html>
