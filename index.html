<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jumbobøger Vælg Covers</title>
<style>
body { background:#000; color:#fff; font-family:sans-serif; text-align:center;}
.grid { display:grid; grid-template-columns: repeat(auto-fill, 120px); gap:10px; justify-content:center;}
img { width:120px; height:180px; object-fit:cover; border:2px solid transparent; cursor:pointer;}
img:hover { border-color: yellow;}
</style>
</head>
<body>

<h1>Vælg rigtige covers</h1>
<p>Klik på det rigtige cover – det gemmes automatisk</p>

<div id="container"></div>

<script>
async function loadOptions(num){
  const res = await fetch(`https://duckduckgo.com/?q=Jumbobog+${num}+cover&iax=images&ia=images`);
  const text = await res.text();
  const matches = [...text.matchAll(/"image":"(https:\\/\\/[^"]+)/g)];
  return matches.slice(0,4).map(m=>m[1].replace(/\\/g,''));
}

async function build(){
  const container = document.getElementById('container');

  for(let i=1;i<=50;i++){
    const div = document.createElement('div');
    div.innerHTML = "<h3>"+i+"</h3>";
    div.className = "grid";

    const imgs = await loadOptions(i);

    imgs.forEach(url=>{
      const img = document.createElement('img');
      img.src = url;
      img.onclick = async ()=>{
        await fetch('/api/save', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id:i, url:url})
        });
        img.style.borderColor = 'lime';
      };
      div.appendChild(img);
    });

    container.appendChild(div);
  }
}

build();
</script>

</body>
</html>
